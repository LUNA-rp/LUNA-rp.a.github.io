    <main class="container settings-container">
      <section class="settings-card">
        <h2>Tamaño de la letra</h2>
        <p>Ajusta el tamaño para que la lectura sea cómoda.</p>
        <div class="control-group">
          <span>Pequeña</span>
          <input
            type="range"
            id="fontSizeRange"
            min="16"
            max="32"
            value="18"
            step="2"
            aria-label="Cambiar tamaño de fuente"
          />
          <span>Grande</span>
        </div>
      </section>

      <section class="settings-card">
        <h2>Tema de color</h2>
        <div class="button-group">
          <button class="btn-theme btn-light" onclick="setTheme('light')">
            Modo Claro
          </button>
          <button class="btn-theme btn-dark" onclick="setTheme('dark')">
            Modo Oscuro
          </button>
          <button class="btn-theme btn-cream" onclick="setTheme('cream')">
            Modo Papel (Suave)
          </button>
        </div>
      </section>
    </main>
